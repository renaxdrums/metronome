name: Android asset packaging
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-packaging.yml']
  push:
    paths: ['android/**', '.github/workflows/android-packaging.yml']
permissions:
  contents: read
jobs:
  assets:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify APK archive paths and asset bytes
        shell: pwsh
        run: ./android/test-apk-assets.ps1
