name: Prepare human metronome voices

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-human-voices.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download real human recordings and prepare 80 WAV samples
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, urllib.parse, urllib.request, urllib.error, tarfile, shutil, sys, time, hashlib

          ROOT = pathlib.Path("assets/voices")
          ROOT.mkdir(parents=True, exist_ok=True)
          TMP = pathlib.Path("/tmp/renax-human-voices")
          shutil.rmtree(TMP, ignore_errors=True)
          TMP.mkdir(parents=True)

          EN = ["one","two","three","four","five","six","seven","eight","nine","ten",
                "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen",
                "eighteen","nineteen","twenty"]
          FR = ["un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix",
                "onze","douze","treize","quatorze","quinze","seize","dix-sept",
                "dix-huit","dix-neuf","vingt"]

          def get(url, dest, polite=False):
              print("GET", url, flush=True)
              last = None
              for attempt in range(1, 7):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"RENAX-DRUMS/2.6 (human metronome audio; GitHub Actions)"})
                      with urllib.request.urlopen(req, timeout=90) as r:
                          dest.write_bytes(r.read())
                      if polite:
                          time.sleep(2.5)
                      return
                  except urllib.error.HTTPError as e:
                      last = e
                      if e.code != 429 or attempt == 6:
                          raise
                      wait = 5 * attempt
                      print(f"Wikimedia rate limit; waiting {wait}s", flush=True)
                      time.sleep(wait)
              raise last

          def process(src, dest):
              dest.parent.mkdir(parents=True, exist_ok=True)
              # Keep the original human pitch/timing. Tighten each spoken sample for
              # metronome use: remove pre-roll decisively without pitch/time stretching,
              # trim excessive tail silence, tame sub-bass and normalize spoken loudness.
              filt = (
                  "highpass=f=65,"
                  "silenceremove="
                  "start_periods=1:start_duration=0:start_threshold=-44dB:start_silence=0.002:"
                  "stop_periods=1:stop_duration=0.10:stop_threshold=-46dB:stop_silence=0.035,"
                  "loudnorm=I=-18:TP=-1.5:LRA=10"
              )
              subprocess.run([
                  "ffmpeg","-hide_banner","-loglevel","error","-y",
                  "-i",str(src),"-vn","-ac","1","-ar","48000",
                  "-af",filt,"-c:a","pcm_s16le",str(dest)
              ], check=True)

          def github_counting_bank(bank):
              # EnjoyPA real human male counting pack, mirrored by PEBL.
              # PEBL's license file maps all 01..20 clips to Freesound originals under CC0.
              base = "https://raw.githubusercontent.com/stmueller/pebl/eb22a0725d765a0597a4905920ad3c603b1c9ae8/battery/PASAT/audio"
              rawdir = TMP / bank
              rawdir.mkdir(parents=True, exist_ok=True)
              for n in range(1, 21):
                  raw = rawdir / f"{n:02d}.ogg"
                  get(f"{base}/{n:02d}.ogg", raw)
                  process(raw, ROOT / bank / f"{n:02d}.wav")

          def normalize_word(s):
              import unicodedata, re
              s = unicodedata.normalize("NFKC", s).strip().lower()
              s = s.replace("‐","-").replace("‑","-").replace("–","-").replace("—","-")
              s = re.sub(r"\\s+", " ", s)
              return s

          def shtooka_fr_male_bank(bank, words):
              # Full Shtooka fra-balm-voc archive, real Paris-region male speaker.
              # Download the stable collection once and resolve words through index.tags.txt.
              archive = TMP / "fra-balm-voc_flac.tar.xz"
              url = "https://fsi-languages.yojik.eu/audiocollections/archives/fra-balm-voc_flac.tar.xz"
              get(url, archive)
              unpack = TMP / "fra-balm-voc"
              unpack.mkdir(parents=True, exist_ok=True)
              with tarfile.open(archive, "r:xz") as tf:
                  tf.extractall(unpack)

              index_files = list(unpack.rglob("index.tags.txt"))
              if not index_files:
                  raise RuntimeError("fra-balm-voc: index.tags.txt not found")
              index_path = index_files[0]

              mapping = {}
              current = None
              for rawline in index_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = rawline.strip()
                  if line.startswith("[") and line.endswith("]"):
                      current = line[1:-1]
                  elif line.startswith("SWAC_TEXT=") and current:
                      text_value = line.split("=",1)[1].strip()
                      mapping.setdefault(normalize_word(text_value), current)

              for n, word in enumerate(words, 1):
                  key = normalize_word(word)
                  filename = mapping.get(key)
                  if not filename:
                      raise RuntimeError(f"fra-balm-voc: missing French number {n}: {word}")
                  src_candidates = list(unpack.rglob(filename))
                  if not src_candidates:
                      raise RuntimeError(f"fra-balm-voc: file not found for {word}: {filename}")
                  process(src_candidates[0], ROOT / bank / f"{n:02d}.wav")

          def freeswitch_bank(bank, release_tag, archive_name, words):
              archive = TMP / archive_name
              url = f"https://github.com/freeswitch/freeswitch-sounds/releases/download/{release_tag}/{archive_name}"
              get(url, archive)
              unpack = TMP / (bank + "-unpack")
              unpack.mkdir(parents=True, exist_ok=True)
              with tarfile.open(archive, "r:gz") as tf:
                  tf.extractall(unpack)
              files = list(unpack.rglob("*.wav"))
              for n, word in enumerate(words, 1):
                  # FreeSWITCH digits are named 1.wav ... 20.wav in the digits directory.
                  candidates = [p for p in files if p.name == f"{n}.wav" and "digits" in p.parts]
                  if not candidates:
                      raise RuntimeError(f"Missing FreeSWITCH digit {n} for {bank}")
                  process(candidates[0], ROOT / bank / f"{n:02d}.wav")

          # Male voices: real human recordings from open audio projects.
          github_counting_bank("voice-men-en")
          shtooka_fr_male_bank("voix-homme-fr", FR)

          # Female voices: professionally recorded FreeSWITCH prompt packs, MPL.
          freeswitch_bank(
              "voice-female-en",
              "en-us-callie-1.0.53",
              "freeswitch-sounds-en-us-callie-48000-1.0.53.tar.gz",
              EN
          )
          freeswitch_bank(
              "voix-femme-fr",
              "fr-ca-june-1.0.51",
              "freeswitch-sounds-fr-ca-june-48000-1.0.51.tar.gz",
              FR
          )

          # Structural QA: every bank must contain exactly 20 playable non-empty WAVs.
          banks = ["voice-men-en","voice-female-en","voix-homme-fr","voix-femme-fr"]
          for bank in banks:
              files = sorted((ROOT / bank).glob("*.wav"))
              if len(files) != 20:
                  raise RuntimeError(f"{bank}: expected 20 WAVs, got {len(files)}")
              for f in files:
                  if f.stat().st_size < 1000:
                      raise RuntimeError(f"{f}: suspiciously small")
                  subprocess.run(
                      ["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(f)],
                      check=True, stdout=subprocess.DEVNULL
                  )

          source_lines = [
              "# RENAX DRUMS — human metronome voice sources",
              "",
              "These are real human recordings, not text-to-speech.",
              "",
              "## Voice men EN",
              "- Speaker: EnjoyPA (human counting pack)",
              "- Project: Freesound / PEBL mirror",
              "- License: CC0 1.0",
              "",
              "## Voice female EN",
              "- Voice: Callie",
              "- Project: FreeSWITCH Sounds",
              "- License: MPL",
              "",
              "## Voix homme FR",
              "- Speaker: Vion Nicolas (Paris region)",
              "- Project: Shtooka / Wikimedia Commons",
              "- License: CC BY 2.0 France",
              "",
              "## Voix femme FR",
              "- Voice: June (French Canadian)",
              "- Project: FreeSWITCH Sounds",
              "- License: MPL",
              "",
              "RENAX processing: mono PCM WAV 48 kHz / 16-bit, metronome-tight leading/trailing silence trim, 65 Hz high-pass and loudness normalization. No pitch shifting, no time stretching and no synthetic speech."
          ]
          (ROOT / "SOURCES.md").write_text("\\n".join(source_lines) + "\\n", encoding="utf-8")
          PY

      - name: Commit human voice samples
        run: |
          git config user.name "RENAX DRUMS Audio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/voices
          git diff --cached --quiet && exit 0
          git commit -m "Add real human metronome voice samples"
          git push
