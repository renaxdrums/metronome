name: CC0 metronome audio validation

on:
  push:
    branches: [main, audio/cc0-pro-20261011]
  pull_request:
    branches: [main, 'audit/phase-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sampled-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check asset versions
        run: |
          node tools/stamp-assets.cjs --check
          node tools/check-test-coverage.cjs
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Install locked test dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install chromium --with-deps
      - name: Lint and incremental formatting
        run: |
          pnpm lint
          pnpm format:check
          pnpm type-check
          STYLE_BUDGET_BASE=${{ github.event.pull_request.base.sha }} pnpm check:styles
          pnpm test:coverage:core
          node tests/midi-resource-test.cjs
      - name: Library resilience and accessible controls
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/resilience-test.cjs
          node tests/numbox-accessibility-test.cjs
          node tests/tempo-fader-test.cjs
          node tests/intro-lifecycle-test.cjs
          node tests/pro-sound-context-test.cjs
          MEIXS_BASE_REF=${{ github.event.pull_request.base.sha || github.sha }} node tests/meixs-colors-test.cjs
      - name: Install MP3 inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Five confirmed robustness regressions
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/robustness-boundaries-test.cjs
      - name: Audio headroom and sample integration
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/instrument-samples-test.cjs
          node tests/bell-resonance-test.cjs
          node tests/track-beat-corrections-test.cjs
          node tests/track-last-block-test.cjs
      - name: Timing at both device sample rates, with a negative control
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/timing-test.cjs
          node tests/two-consonant-timing-test.cjs
          node tests/independent-voice-timing-test.cjs
          node tests/tooling-guards-test.cjs
      - name: Phase 2 playback ownership and unchanged PCM
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/playback-support-test.cjs
          PCM_ONLY=1 node tests/quality-invariance-test.cjs
      - name: Exact theme screenshots and computed styles against the PR base
        if: github.event_name == 'pull_request'
        env:
          INVARIANCE_REF: ${{ github.event.pull_request.base.sha }}
          VISUAL_ONLY: '1'
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/quality-invariance-test.cjs
      - name: MP3 export regression
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/mp3-export-test.cjs
      - name: MP3 output level and export dialog
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/mp3-output-level-test.cjs
      - name: Accessibility, emergency backup, offline mode and module boundaries
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/accessibility-test.cjs
          node tests/emergency-backup-test.cjs
          node tests/performance-resilience-test.cjs
          node tests/offline-cache-test.cjs
          node tests/module-extraction-test.cjs
          node tests/language-fallback-test.cjs
          node tests/diagnostics-test.cjs
          node tests/security-text-test.cjs
          node tests/audio-activation-test.cjs
          node tests/settings-resize-test.cjs
          node tests/startup-layout-test.cjs
          node tests/phone-rotation-test.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sound-menu-foreground
          path: tests/results/sound-menu-*

  firebase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install chromium --with-deps
      - name: Isolated account and database checks
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          export RENAX_CHROME="$CHROME_PATH"
          pnpm exec firebase emulators:exec --only auth,firestore --project demo-renax-backup "node tests/run.cjs --firebase"

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install chromium --with-deps
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo timeout 120 apt-get update -qq
            sudo timeout 180 apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Build and verify actual release
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tools/build-production.cjs --csp
          pnpm test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: tests/results/production
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/site

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install chromium firefox webkit --with-deps
      - name: Provide an actual audio service on the headless runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          pactl load-module module-null-sink sink_name=qa_audio
          pactl set-default-sink qa_audio
          pactl info
      - name: Desktop and mobile browser engines
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          export TEST_OUTPUT_DIR=tests/results/compatibility
          pnpm test:compat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-compatibility
          path: tests/results/compatibility

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [sampled-audio, firebase, production, compatibility]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified production artifact
        id: deployment
        uses: actions/deploy-pages@v4
