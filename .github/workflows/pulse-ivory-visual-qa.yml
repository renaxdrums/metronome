name: RENAX PULSE visual regression (staging only)
on:
  push:
    branches:
      - design/pulse-ivory-lime-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium --with-deps
      - name: Visual and interaction audit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/renax-http.log 2>&1 &
          sleep 3
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          let fails=0,checks=0;
          function assertion(ok,message,context=''){checks++;if(!ok){fails++;console.error('FAIL',message,context)}else console.log('PASS',message,context)}
          const sizes=[[1440,900],[1280,720],[1101,720],[1024,768],[390,844],[360,640],[320,600]];
          for(const [width,height] of sizes){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            const errors=[];
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.evaluate(()=>{localStorage.removeItem('renax-appearance');localStorage.setItem('renax.arrival.enabled.v1','false')});
            await page.reload({waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForSelector('#workspaceNav [data-workspace="metronome"]',{timeout:30000});
            await page.evaluate(()=>document.getElementById('renaxArrival')?.remove());
            await page.waitForTimeout(1200);
            const audit=await page.evaluate(()=>{
              const q=s=>document.querySelector(s),rect=e=>{if(!e)return null;const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}};
              const isVisible=e=>!!e&&getComputedStyle(e).display!=='none'&&getComputedStyle(e).visibility!=='hidden'&&e.getBoundingClientRect().width>5;
              const nav=[...document.querySelectorAll('#workspaceNav button')],panel=q('.panel-visu'),circle=q('#sequencerContainer'),steps=[...document.querySelectorAll('#sequencerContainer .step')],erase=q('.reset-undo-tools #panicBtn'),undo=q('.reset-undo-tools #undoBtn');
              return {theme:document.documentElement.dataset.theme,nav:nav.map(n=>({label:n.innerText.trim(),r:rect(n)})),panel:rect(panel),circle:rect(circle),steps:steps.map(rect),eraser:rect(erase),undo:rect(undo),visibleEraser:isVisible(erase),visibleUndo:isVisible(undo),footerEraser:!!q('footer #panicBtn'),footerReset:[...document.querySelectorAll('footer button')].some(b=>b.textContent.trim().toLowerCase()==='reset'),play:isVisible(q('#playBtn')),bodyWidth:document.body.scrollWidth,viewport:innerWidth,bodyHeight:document.body.scrollHeight,screenHeight:innerHeight,panelColor:getComputedStyle(panel).backgroundColor,navColor:getComputedStyle(nav[0]).backgroundColor,navLayout:getComputedStyle(q('#workspaceNav')).display,editorVisible:isVisible(q('#scoreEditBtn')),metroCaption:getComputedStyle(q('#scoreMetronomeBtn'),'::after').content,scoreCaption:getComputedStyle(q('#scorePartitionBtn'),'::after').content,errors:[]};
            });
            const tag=width+'x'+height;
            assertion(audit.theme==='ivory','Ivory default',tag);
            assertion(audit.nav.length===6,'Six workspaces',tag);
            assertion(audit.visibleEraser&&audit.visibleUndo&&!audit.footerEraser&&!audit.footerReset,'Eraser and undo, no bottom Reset',tag);
            assertion(audit.play,'Play transport exists',tag);
            assertion(!audit.editorVisible,'Editor pencil hidden in circular view',tag);
            assertion(audit.metroCaption.includes('Métronome')&&audit.scoreCaption.includes('Partition'),'View captions visible',tag+' '+audit.metroCaption+' / '+audit.scoreCaption);
            assertion(audit.circle!==null&&audit.circle.w>140&&audit.circle.bottom<=height+4,'Circular visualizer in viewport',tag+' '+JSON.stringify(audit.circle));
            assertion(audit.steps.length>=4,'Beat controls preserved',tag+' '+audit.steps.length);
            assertion(audit.nav.every(n=>n.r.x>=-3&&n.r.right<=width+3&&n.r.y>=0&&n.r.bottom<=height),'Navigation in viewport',tag);
            assertion(audit.bodyWidth<=width+3,'No horizontal page overflow',tag+' scrollWidth='+audit.bodyWidth);
            assertion(audit.panel!==null&&audit.panel.bottom<=height+4,'Visualizer panel in viewport',tag);
            assertion(errors.length===0,'No uncaught page errors',tag+' '+JSON.stringify(errors.slice(0,3)));
            await page.screenshot({path:'pulse-'+tag+'.png',fullPage:true});
            if(width===390){
              for(const space of ['polyrhythm','training','sequence','multi','tracks','metronome']){
                await page.locator('body > #workspaceNav [data-workspace="'+space+'"]').click();
                assertion((await page.locator('body').getAttribute('data-workspace'))===space,'Switch '+space,tag);
                await page.waitForTimeout(160);
                if(['polyrhythm','tracks'].includes(space))await page.screenshot({path:'pulse-'+space+'-390.png',fullPage:true});
              }
              await page.locator('#scorePartitionBtn').click();
              assertion(await page.locator('.panel-visu').evaluate(el=>el.classList.contains('score-view')),'Score view switch',tag);
              await page.locator('#scoreMetronomeBtn').click();
              assertion(!(await page.locator('.panel-visu').evaluate(el=>el.classList.contains('score-view'))),'Back to circular view',tag);
              await page.locator('#index2SettingsBtn').click();
              assertion(await page.locator('#index2SettingsPanel').isVisible(),'Settings open',tag);
            }
            await page.close();
          }
          await browser.close();
          console.log('SUMMARY:', checks,'checks;',fails,'failures');
          if(fails)process.exit(1);
          JS
      - name: Show review captures in job log
        if: always()
        run: |
          for img in pulse-1440x900.png pulse-390x844.png; do
            if [ -s "$img" ]; then
              echo "RENAX_IMG_${img}_START"
              base64 -w0 "$img"
              echo
              echo "RENAX_IMG_${img}_END"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-screenshots
          path: pulse-*.png
